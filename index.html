<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#1f1b3a;--ac:#6c4cf5;--ok:#1f9d55;--bad:#d64545;--mu:#7a7599;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122b;--card:#221e42;--tx:#f0eeff;--ac:#9b84ff;--ok:#3ecf80;--bad:#ff6b6b;--mu:#a29ec6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15122b;--card:#221e42;--tx:#f0eeff;--ac:#9b84ff;--ok:#3ecf80;--bad:#ff6b6b;--mu:#a29ec6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;text-align:center;padding:24px 16px}
main{width:100%;max-width:440px}
h1{font-size:28px;margin:0 0 20px}
h2{font-size:20px;margin:0 0 14px}
.topic{display:block;width:100%;margin-bottom:12px;background:var(--card);border:2px solid transparent;border-radius:16px;padding:20px;font-size:20px;color:var(--tx);cursor:pointer}
.topic small{display:block;font-size:14px;color:var(--mu);margin-top:4px}
.topic:hover,.topic:active{border-color:var(--ac)}
.hide{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .topic{margin:0;padding:22px 8px}.grid .topic span{display:block;font-size:34px;margin-bottom:4px}
.bar{align-items:center}.exit{border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}.btn.nx{background:var(--card);color:var(--tx)}
.bar{display:flex;justify-content:space-between;color:var(--mu);margin-bottom:10px}
.task{font-size:22px;font-weight:700;margin-bottom:10px}
canvas{width:100%;aspect-ratio:1/1;background:#fff;border-radius:16px;touch-action:none;display:block;border:2px solid var(--mu)}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.pal button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--mu)}
.pal button.sel{border-color:var(--ac);transform:scale(1.15)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tools button{padding:8px 14px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.tools button.sel{background:var(--ac);color:#fff}
.btn{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.alt{background:transparent;color:var(--mu)}
.res{margin-top:14px;font-size:20px;font-weight:700}
.res small{display:block;font-size:16px;font-weight:400;color:var(--mu);margin-top:6px}
</style>
</head>

 <h1>Wybierz swój temat zgadywania</h1>

  <button class="btn alt" id="b1">← Zmień temat</button>

  <div class="task" id="task"></div>
  <canvas id="cv" width="640" height="640"></canvas>
  <div class="tools" id="mt"></div>
  <div class="pal" id="pal"></div>
  <div class="tools" id="tools"></div>
  <button class="btn" id="rate">Oceń rysunek</button>
  <div class="res" id="res"></div>

  if(!sample)throw {code:"no_sample"};
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const prompt="Jesteś jurorem w grze rysunkowej. Na załączonym obrazku jest rysunek gracza. Gracz miał narysować: „"+task+"”. Oceń rysunek w skali od 1 do 10 (liczba całkowita). "+(hard?"To tryb trudny: oceń też, czy widać dodatkowy szczegół z zadania (np. cechy rasy, kolory, charakterystyczne elementy). ":"")+"Pusta lub bezsensowna kartka to 1. Bądź uczciwy, ale życzliwy. Odpowiedz wyłącznie JSON-em: {\"score\":liczba,\"comment\":\"jedno krótkie zdanie po polsku\",\"tip\":\"w skrócie, co gracz mógłby dodać lub poprawić na rysunku, maksymalnie jedno zdanie\"}";
  const out=await sample(prompt,{images:[blob],modelTier:"quick",cache:false});
  let n,c="",t="";
  try{const j=JSON.parse(out.text.match(/\{[\s\S]*\}/)[0]);n=Number(j.score);c=j.comment||"";t=j.tip||"";}
  catch(_){const m=out.text.match(/\b(10|[1-9])\b/);n=m?Number(m[1]):NaN;c=out.text.slice(0,140);}
  if(!(n>=1))throw {code:"bad_answer"};
  n=Math.max(1,Math.min(10,Math.round(n)));
  score+=n;$("score").textContent="Punkty: "+score;
  $("res").innerHTML="Ocena: "+n+"/10 "+(n>=8?"🎉":n>=5?"👍":"🙂")+"<small></small><small></small>";const sm=$("res").querySelectorAll("small");sm[0].textContent=c;sm[1].textContent=t?"💡 Dodaj: "+t:"";
  $("rate").classList.add("hide");
 }catch(e){
  const code=(e&&e.code)||"unknown";
  $("res").textContent=ERR[code]||((code==="no_runtime"||code==="no_sample")?"Ocenianie AI działa tylko po otwarciu gry w aplikacji Claude, nie w zwykłej przeglądarce.":"Nie udało się ocenić ("+code+"). Spróbuj jeszcze raz.");
  busy=false;$("rate").disabled=false;
 }
}
$("easy").onclick=()=>start(false);$("hard").onclick=()=>start(true);
$("b1").onclick=()=>show("menu");$("exit").onclick=()=>show("menu");
$("rate").onclick=rate;$("next").onclick=round;
</script>
